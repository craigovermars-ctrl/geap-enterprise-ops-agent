name: AgentOps CI & Evaluation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test-and-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run automated unit & golden evaluation suite
        run: pytest -v

  terraform-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Validate Terraform IaC
        working-directory: terraform
        run: |
          terraform init -backend=false
          terraform validate

  deploy-agent-engine:
    needs: [test-and-eval, terraform-validate]
    if: github.ref == 'refs/heads/main' && vars.GCP_PROJECT_ID != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy ADK agent via agents CLI
        run: |
          echo "Deploying geap_enterprise_ops_coordinator to Vertex AI Agent Engine:"
          echo "adk deploy agent_engine --project=${{ vars.GCP_PROJECT_ID }} --region=us-central1 agent_app"
